[project]
name = "clauder-mcp"
version = "0.9.0"
description = "MCP server connecting AI assistants to RStudio for interactive R coding and data analysis"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nykko Vitali" }]
keywords = ["r", "rstudio", "mcp", "llm", "data-science"]
license = { text = "MIT" }
dependencies = [
    # mcp 2.0 (spec 2026-07-28) removed the Server.list_tools/call_tool
    # decorator API this server is built on — resolve 1.x until we migrate
    "mcp>=1.0.0,<2",
    "httpx",
]

[project.scripts]
clauder-mcp = "clauder_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
