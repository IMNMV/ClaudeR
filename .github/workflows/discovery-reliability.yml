name: discovery-reliability
on:
  pull_request:
  push:
    branches: [main, 'fix/discovery-reliability-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ./clauder-mcp pytest
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m pytest clauder-mcp/tests -q
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
      - run: R CMD INSTALL .
        shell: bash
      - run: Rscript tests/discovery-reliability.R
