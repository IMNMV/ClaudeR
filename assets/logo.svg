<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 190" width="300" height="190"
     role="img" aria-label="Winged R logo">
  <defs>
    <!-- one feather, drawn pointing left from its anchor -->
    <path id="fo" d="M0,0 C-15,-10 -46,-13 -72,-4 C-46,8 -15,9 0,0 Z"/>
  </defs>

  <!-- left wing -->
  <g fill="none" stroke="#C8622B" stroke-width="3.6" stroke-linejoin="round">
    <g transform="translate(104,96)">
      <animateTransform attributeName="transform" type="rotate"
        values="-8 0 0; 12 0 0; -8 0 0" dur="2.6s" keyTimes="0;0.5;1"
        calcMode="spline" keySplines="0.42 0 0.2 1; 0.42 0 0.2 1"
        repeatCount="indefinite" additive="sum"/>
      <use href="#fo" transform="rotate(-32) scale(0.74)"/>
      <use href="#fo" transform="rotate(-16) scale(0.92)"/>
      <use href="#fo" transform="rotate(0)   scale(1.00)"/>
      <use href="#fo" transform="rotate(16)  scale(0.90)"/>
      <use href="#fo" transform="rotate(31)  scale(0.72)"/>
    </g>
  </g>

  <!-- right wing, mirrored -->
  <g fill="none" stroke="#C8622B" stroke-width="3.6" stroke-linejoin="round"
     transform="translate(300,0) scale(-1,1)">
    <g transform="translate(104,96)">
      <animateTransform attributeName="transform" type="rotate"
        values="-8 0 0; 12 0 0; -8 0 0" dur="2.6s" keyTimes="0;0.5;1"
        calcMode="spline" keySplines="0.42 0 0.2 1; 0.42 0 0.2 1"
        repeatCount="indefinite" additive="sum"/>
      <use href="#fo" transform="rotate(-32) scale(0.74)"/>
      <use href="#fo" transform="rotate(-16) scale(0.92)"/>
      <use href="#fo" transform="rotate(0)   scale(1.00)"/>
      <use href="#fo" transform="rotate(16)  scale(0.90)"/>
      <use href="#fo" transform="rotate(31)  scale(0.72)"/>
    </g>
  </g>

  <!-- the R lifts on the downbeat -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 2.5; 0 -2.5; 0 2.5" dur="2.6s" keyTimes="0;0.5;1"
      calcMode="spline" keySplines="0.42 0 0.2 1; 0.42 0 0.2 1"
      repeatCount="indefinite"/>
    <text x="150" y="132" text-anchor="middle"
      font-family="Georgia,'Times New Roman',serif" font-size="104"
      font-weight="700" fill="#C8622B">R</text>
  </g>
</svg>
